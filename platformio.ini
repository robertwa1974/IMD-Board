; Two firmwares in one project:
;   imd    - the IMD board itself (STM32G031K8, HV side)           src/imd/
;   m5dial - IR155/IMD MHS decoder on an M5Dial (ESP32-S3)          src/m5dial/
; Shared, host-testable logic lives in lib/imd_core and lib/ir155_decoder.

[platformio]
default_envs = imd

; IMD board. Bench target: Nucleo-G031K8 (same MCU as the PCB, Serial = PA2/PA3).
[env:imd]
platform = ststm32
board = nucleo_g031k8
framework = arduino
build_src_filter = +<imd/>
lib_ignore = ir155_decoder
; The last 2 kB flash page holds the calibration (EEPROM emulation). Cap the program at 62 kB so
; the linker refuses any build that would overlap it.
board_upload.maximum_size = 63488
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -D SERIAL_TX_BUFFER_SIZE=256
test_ignore = *

; M5Dial (ESP32-S3, StampS3 module). Port B = G1/G2 - confirm for your board revision.
[env:m5dial]
platform = espressif32@6.13.0
board = m5stack-stamps3
framework = arduino
build_src_filter = +<m5dial/>
lib_ignore = imd_core
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; Host unit tests: pio test -e native
; Needs a host C++ compiler on PATH (e.g. MinGW-w64 gcc on Windows).
[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
lib_compat_mode = off
build_flags = -std=c++17 -Wall -Wextra
