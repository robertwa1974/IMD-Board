; IR155 MHS/OKHS decoder (reads a Bender IR155 now, and this DIY IMD later - same outputs).
; The IMD board's own STM32G031 firmware will get its own env when it is written.

[platformio]
default_envs = m5dial

; M5Dial (ESP32-S3, StampS3 module). Port B = G1/G2 - confirm for your board revision.
[env:m5dial]
platform = espressif32@6.13.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; Host unit tests of the decode logic: pio test -e native
; Needs a host C++ compiler on PATH (e.g. MinGW-w64 gcc on Windows).
[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
lib_compat_mode = off
build_flags = -std=c++17 -Wall -Wextra
